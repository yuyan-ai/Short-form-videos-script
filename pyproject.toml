[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "short-video-agent"
version = "0.1.0"
description = "Fact-grounded short-form video script agent built with LangGraph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["langgraph", "pydantic>=2,<3", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

